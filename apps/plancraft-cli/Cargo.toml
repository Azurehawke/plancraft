[package]
name = "plancraft-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PlanCraft command line: inspect, convert, evaluate, script and serve MCP without a window"
publish = false

[lints]
workspace = true

[[bin]]
name = "plancraft-cli"
path = "src/main.rs"

[dependencies]
gridcraft-engine = { workspace = true }
gridcraft-mcp = { workspace = true }
plancraft-project = { workspace = true }
plancraft-project-sync = { workspace = true }
plancraft-schedule = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# `check`: validating the packages PlanCraft writes (content types, relationships).
zip = { workspace = true }
quick-xml = { workspace = true }

[dev-dependencies]
tempfile = "3"
